name: kidzoo
description: "Kids education app"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.1


dependencies:
  animations: ^2.0.11
  audioplayers: ^6.1.0
  bloc: ^9.0.0
  confetti: ^0.8.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  flame: null
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_svg: ^2.0.16
  flutter_tts: ^4.2.3
  google_fonts: ^6.1.0
  gal: ^2.3.0
  lottie: ^3.3.1
  shared_preferences: ^2.5.3
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/gen/images/
    - assets/gen/images/home/
    - assets/gen/images/flappy/
    - assets/gen/images/shapes/
    - assets/gen/images/numbers/
    - assets/gen/images/alphabet/
    - assets/gen/images/animal/
    - assets/gen/images/puzzle/
    - assets/gen/images/puzzle/gazelle block/
    - assets/gen/images/puzzle/ghost block/
    - assets/gen/images/puzzle/party block/
    - assets/gen/icons/
    - assets/gen/lottie/
    - assets/gen/gif/
    - assets/data/
    - assets/lang/
    - assets/audio/
    - assets/flags/

flutter_assets:
  assets_path: assets/gen/
  output_path: lib/core/utils/
  filename: assets.dart
  field_prefix: null
  #   - images/a_dot_ham.jpeg

