# Codemagic CI/CD configuration for Flutter iOS
# Documentation: https://docs.codemagic.io/yaml-quick-start/flutter-apps/

workflows:
  ios-workflow:
    name: Flutter iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "dev.annotex.kidzo"
      # To enable code signing once configured in Codemagic Team / App settings:
      # groups:
      #   - app_store_credentials
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: dev.annotex.kidzo
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find ios -name "Podfile" -execdir pod install \;
      # Optional: Uncomment if code signing profiles are configured
      # - name: Set up code signing settings on Xcode project
      #   script: |
      #     xcode-project use-profiles
      - name: Build Flutter iOS IPA
        script: |
          # Build release IPA (unsigned for initial CI verification)
          flutter build ipa --release --no-codesign
          # If code signing is set up with profiles, use:
          # flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    # Optional publishing step:
    # publishing:
